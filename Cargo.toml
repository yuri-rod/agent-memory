[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
description = "Universal, local-first cross-session memory and architectural decision ledger for coding agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"

[dev-dependencies]
tempfile = "3.10"
