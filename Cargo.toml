[package]
name = "agent-memory"
version = "0.1.2"
edition = "2021"
description = "Local SQLite project memory for coding agents, with a CLI and MCP server"
repository = "https://github.com/yuri-rod/agent-memory"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"

[dev-dependencies]
tempfile = "3.10"
